[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecheck"
version = "0.1.0"
description = "원고 수치 출처 추적 — 원고(.docx/.md/.tex/.txt)와 분석 출력 번들(CSV/TSV/JSON/XLSX/MD/TXT)을 함께 읽어, Abstract·Results·표·캡션에 적힌 숫자가 실제로 그 출력 안에 존재하는지 반올림 자릿수를 감안해 전수 대조합니다. 어느 출력에도 없는 숫자(출처 불명)와 이전 번들에만 있는 숫자(재분석 후 갱신 누락)를 찾아 파일·행·열까지 찍어 줍니다. 산술을 재계산하지 않고(numcheck 영역), 라벨 의미를 추정하지 않으며, 커버리지 자백 없이는 리포트를 내지 않고 미매칭율이 임계를 넘으면 exit 3 으로 멈춥니다. 완전 오프라인·읽기 전용, 표준 라이브러리만 사용"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyeonjoong", email = "hyeonjoongk@gmail.com" }]
keywords = ["manuscript", "provenance", "numeric-traceability", "reproducible-research",
            "clinical-trial", "statistics-output", "docx", "csv", "xlsx",
            "audit", "offline", "korean", "publication"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Markup",
    "Environment :: Console",
    "Natural Language :: Korean",
]

# 외부 의존성 없음 — .docx/.xlsx 는 zipfile+ElementTree, CSV 는 csv, 숫자는 decimal 로 충분합니다.
# (tests/test_offline.py 가 이 줄과 소스의 import 를 정적으로 검사합니다.)
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/hyeonjoong/weekly-tools"

[project.scripts]
tracecheck = "tracecheck.cli:run"

[tool.setuptools.packages.find]
include = ["tracecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
