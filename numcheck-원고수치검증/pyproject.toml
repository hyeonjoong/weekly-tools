[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcheck"
version = "0.1.0"
description = "원고(.docx/.md/.tex/.txt)에 적힌 숫자를 전수 재계산해 대조하는 오프라인 CLI — 비율(분자/분모 대비), 보고된 검정통계량에서 나오는 p(자체 구현 t/F/χ²/z/r CDF), 하위군 N 합계, 정수 척도 평균의 산술적 도달 가능성(GRIM/GRIMMER), 변화량(사후−사전), 신뢰구간 정합과 CI↔p 모순, 유의성 문구와 p의 어긋남을 줄번호가 붙은 한국어 지적 목록으로 냅니다. 반올림·버림·올림을 모두 허용하는 구간 비교로 오탐을 억제하고, 단측검정·다중비교 보정 단서가 있으면 치명을 경고로 자동 강등합니다. 리포트 첫머리에 '후보 N개 중 재계산 M개 / 건너뜀 K개(사유별)'를 반드시 찍어 무엇을 못 봤는지 자백합니다. 데이터 파일 불필요, 네트워크 0, 원본 읽기 전용"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyeonjoong", email = "hyeonjoongk@gmail.com" }]
keywords = ["manuscript", "numbers", "arithmetic", "verification", "statcheck",
            "p-value", "grim", "grimmer", "proportion", "confidence-interval",
            "clinical-trial", "reproducibility", "docx", "latex", "offline",
            "peer-review", "revision", "korean"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup",
    "Environment :: Console",
    "Natural Language :: Korean",
]

# 외부 의존성 없음 — .docx 는 표준 라이브러리 zipfile + xml.etree 로 직접 읽고,
# t/F/χ²/z/r 의 꼬리 확률은 불완전 베타·감마를 직접 구현해 계산합니다.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
numcheck = "numcheck.cli:main"

[tool.setuptools.packages.find]
include = ["numcheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
