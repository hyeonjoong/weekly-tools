[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robustcheck"
version = "0.1.0"
description = "결과 견고성 점검 — 이미 정해진 주 분석 하나의 결론이 분석 선택(이상치 규칙·결측 처리·모수/비모수·로그변환·피험자 제외)을 바꿔도 살아남는지를 수십~수백 번 재계산해 '뒤집히는 조합'만 찍어 주는 오프라인 CLI. 새 결론을 만들지 않고, 가장 유의한 조합을 추천하지 않는다 (표준 라이브러리만)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyeonjoong", email = "hyeonjoongk@gmail.com" }]
keywords = ["sensitivity-analysis", "robustness", "specification-curve",
            "multiverse-analysis", "leave-one-out", "outliers", "missing-data",
            "clinical-trial", "reproducibility", "p-hacking", "effect-size",
            "welch", "mann-whitney", "wilcoxon", "spearman", "ancova",
            "quade", "hedges-g", "peer-review", "reviewer-response"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# 외부 의존성 없음 — 분포 CDF, 검정, 효과크기, CSV 읽기를 전부 표준
# 라이브러리로 구현했다. 네트워크 호출도 0이다.
dependencies = []

[project.scripts]
robustcheck = "robustcheck.cli:main"

[project.urls]
Homepage = "https://github.com/hyeonjoong/weekly-tools"

[tool.setuptools.packages.find]
include = ["robustcheck*"]
