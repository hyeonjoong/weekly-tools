[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jamoscore"
version = "1.0.0"
description = "말지각검사 채점 엑셀을 문항 단위에서 다시 계산하고, 요약표·규칙 채점과 갈리는 곳만 찍어 주는 오프라인 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyeonjoong", email = "hyeonjoongk@gmail.com" }]
keywords = ["audiology", "speech-perception", "korean", "hangul", "scoring", "data-audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
jamoscore = "jamoscore.cli:main"

[project.urls]
Homepage = "https://github.com/hyeonjoong/weekly-tools"

[tool.setuptools]
packages = ["jamoscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
